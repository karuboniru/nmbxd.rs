name: Build and release

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

# PR builds (including forks) never receive repository write permission.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'

jobs:
  build:
    name: Linux ${{ matrix.arch }} (Ubuntu 24.04)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Release publication requires this job, so validate once before building.
      - name: Check release tag matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && matrix.arch == 'x86_64'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag.removeprefix("v") != version:
              raise SystemExit(f"Release tag {tag!r} does not match Cargo.toml version {version!r}")
          print(f"Release tag {tag!r} matches package version {version}")
          PY

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev libfontconfig-dev libfreetype-dev

      - name: Install Rust stable
        id: rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
          echo "version=$(rustc --version | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/release
          key: linux-${{ matrix.arch }}-ubuntu24-rust-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            linux-${{ matrix.arch }}-ubuntu24-rust-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**/Cargo.toml') }}-
            linux-${{ matrix.arch }}-ubuntu24-rust-${{ steps.rust.outputs.version }}-

      # Pure unit tests: no desktop session, cookie, or live posting required.
      # Use the release profile for tests too, reusing the expensive GPUI build.
      - name: Run unit tests
        run: cargo test --release --locked -p rdnmb

      - name: Build release binary
        run: cargo build --release --locked -p rdnmb

      - name: Package Linux distribution
        run: |
          bash scripts/package-linux.sh --skip-build
          cd dist
          sha256sum --check ./*.tar.gz.sha256

      - name: Upload downloadable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rdnmb-linux-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  build-windows:
    name: Windows ${{ matrix.arch }} (MSVC)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - arch: aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Locate Windows shader compiler
        run: |
          # GPUI 0.2.2 otherwise falls back to one hard-coded SDK version.
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$fxc) { throw 'Windows SDK fxc.exe was not found' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV

      - name: Install Rust stable
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --target $env:CARGO_BUILD_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = rustc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output $version
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/release
            target/${{ matrix.target }}/release
          key: windows-${{ matrix.arch }}-msvc-${{ matrix.runner }}-rust-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            windows-${{ matrix.arch }}-msvc-${{ matrix.runner }}-rust-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**/Cargo.toml') }}-
            windows-${{ matrix.arch }}-msvc-${{ matrix.runner }}-rust-${{ steps.rust.outputs.version }}-

      - name: Run unit tests
        run: cargo test --release --locked -p rdnmb

      - name: Build release executable
        run: cargo build --release --locked -p rdnmb

      - name: Package Windows distribution
        run: ./scripts/package-windows.ps1 -SkipBuild -Target $env:CARGO_BUILD_TARGET

      - name: Upload downloadable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rdnmb-windows-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  build-macos:
    name: macOS ${{ matrix.arch }} (macOS 15)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Xcode and Metal toolchain
        id: xcode
        run: |
          xcodebuild -version
          xcrun --sdk macosx metal --version
          xcrun --sdk macosx --find metallib
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(dirname "$(xcrun --find clang)")/../lib" >> "$GITHUB_ENV"
          echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --target "$CARGO_BUILD_TARGET"
          rustup default stable
          rustc --version
          cargo --version
          echo "version=$(rustc --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/release
            target/${{ matrix.target }}/release
          key: macos-${{ matrix.arch }}-${{ matrix.runner }}-xcode-${{ steps.xcode.outputs.version }}-rust-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            macos-${{ matrix.arch }}-${{ matrix.runner }}-xcode-${{ steps.xcode.outputs.version }}-rust-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**/Cargo.toml') }}-
            macos-${{ matrix.arch }}-${{ matrix.runner }}-xcode-${{ steps.xcode.outputs.version }}-rust-${{ steps.rust.outputs.version }}-

      - name: Run unit tests
        run: cargo test --release --locked -p rdnmb

      - name: Build release binary
        run: cargo build --release --locked -p rdnmb

      - name: Package macOS distribution
        run: |
          bash scripts/package-macos.sh --skip-build --target "$CARGO_BUILD_TARGET"
          cd dist
          shasum -a 256 --check ./*.tar.gz.sha256

      - name: Upload downloadable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rdnmb-macos-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish tag release
    needs: [build, build-windows, build-macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Download only this run's tested artifacts; do not rebuild or execute them
      # in the job holding the release token.
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rdnmb-*-${{ github.sha }}
          merge-multiple: true
          path: dist

      - name: Verify package checksums
        working-directory: dist
        run: sha256sum --check ./*.tar.gz.sha256 ./*.zip.sha256

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Pass the tag via an environment variable, not shell interpolation of
          # GitHub expressions. --verify-tag never creates an unintended tag.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "R岛 $RELEASE_TAG" --generate-notes
          fi
          # Reruns replace assets on the same release instead of creating another.
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.zip dist/*.zip.sha256 --clobber
          gh release edit "$RELEASE_TAG" --title "R岛 $RELEASE_TAG" --draft=false
