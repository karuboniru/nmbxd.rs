name: Build and release

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

# PR builds (including forks) never receive repository write permission.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'

jobs:
  build:
    name: Linux x86_64 (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev libfontconfig-dev libfreetype-dev

      - name: Install Rust stable
        id: rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
          echo "version=$(rustc --version | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/release
          key: linux-x86_64-ubuntu24-rust-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            linux-x86_64-ubuntu24-rust-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**/Cargo.toml') }}-
            linux-x86_64-ubuntu24-rust-${{ steps.rust.outputs.version }}-

      # Pure unit tests: no desktop session, cookie, or live posting required.
      # Use the release profile for tests too, reusing the expensive GPUI build.
      - name: Run unit tests
        run: cargo test --release --locked -p nmbxd

      - name: Build release binary
        run: cargo build --release --locked -p nmbxd

      - name: Package Linux distribution
        run: |
          bash scripts/package-linux.sh --skip-build
          cd dist
          sha256sum --check ./*.tar.gz.sha256

      - name: Upload downloadable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nmbxd-linux-x86_64-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish tag release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Download only this run's tested artifacts; do not rebuild or execute them
      # in the job holding the release token.
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nmbxd-linux-x86_64-${{ github.sha }}
          path: dist

      - name: Verify package checksums
        working-directory: dist
        run: sha256sum --check ./*.tar.gz.sha256

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Pass the tag via an environment variable, not shell interpolation of
          # GitHub expressions. --verify-tag never creates an unintended tag.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "X岛黎明版 $RELEASE_TAG" --generate-notes
          fi
          # Reruns replace assets on the same release instead of creating another.
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false
