[package]
name = "rdnmb"
version = "0.1.7"
edition = "2024"
description = "R岛 (rdnmb) — native X island reader"
license = "MIT"

[dependencies]
gpui = "=0.2.2"
gpui-component = "=0.5.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
chrono = "=0.4.45"
sha2 = "0.10"
regex = "1"
html-escape = "0.2"
anyhow = "1"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
arboard = { version = "3.7", features = ["wayland-data-control"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }

[profile.dev]
debug = 0

[profile.release]
strip = "symbols"

# Pinned cosmic-text patch: prefer color emoji for complete emoji clusters.
[patch.crates-io]
cosmic-text = { path = "vendor/cosmic-text" }
gpui-component = { path = "vendor/gpui-component" }

[workspace]
members = ["vendor/cosmic-text", "vendor/gpui-component"]
default-members = ["."]
resolver = "3"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.11.1", default-features = false, features = ["async-std", "raw_handle", "wayland"] }
raw-window-handle = "0.6"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "=0.15.4", default-features = false }
